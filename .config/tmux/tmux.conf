set-option -g default-terminal 'tmux-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'
set -g message-style "bg=#1f2428,fg=#c8d1dc"

setw -g mouse on

unbind C-b
set -g prefix M-a
bind-key M-a send-prefix

# Set 'r' to reload tmux config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

set -g base-index 1              # start indexing windows at 1 instead of 0
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style

# act like vim
setw -g mode-keys vi
bind -r ^ last-window
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
set -s copy-command 'pbcopy'
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'

# Open split panes in current working directory
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Skip confirmation when killing panes
bind x kill-pane

# Enable clicking hyperlinks
set -ga terminal-features "*:hyperlinks"

# Add homebrew to path (needed for tpm tow work)
set-environment -g PATH "/opt/homebrew/bin:/bin:/usr/bin"

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-sessionx'

# floating popup windows
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-bind 'w'
set -g @floax-bind-menu 'W'
set -g @floax-width '88%'
set -g @floax-height '76%'
set -g @floax-border-color '#ff6f00'
set -g @floax-text-color '#c8d1dc'
set -g @floax-session-name 'popup-shell'
set -g @floax-title ' floax '

# floating lazygit
bind g if-shell "command -v lazygit >/dev/null 2>&1" \
  "display-popup -E -x C -y C -w 88% -h 76% -T ' lazygit ' -d '#{pane_current_path}' 'lazygit'" \
  "display-message 'lazygit not found in PATH'"

# floating lazydocker
bind D if-shell "command -v lazydocker >/dev/null 2>&1" \
  "display-popup -E -x C -y C -w 88% -h 76% -T ' lazydocker ' -d '#{pane_current_path}' 'lazydocker'" \
  "display-message 'lazydocker not found in PATH'"

# floating ghostty
bind B if-shell "command -v ghostty >/dev/null 2>&1" \
  "display-popup -E -x C -y C -w 88% -h 76% -T ' boo ' 'ghostty +boo'" \
  "display-message 'ghostty not found in PATH'"

# floating btop
bind b if-shell "command -v btop >/dev/null 2>&1" \
  "display-popup -E -x C -y C -w 88% -h 76% -T ' btop ' 'btop'" \
  "display-message 'btop not found in PATH'"

# sessionx https://github.com/omerxx/tmux-sessionx
set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-bind 'o'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'

# continuum https://github.com/tmux-plugins/tmux-continuum
set -g @continuum-restore 'on'

# theme
set -g @plugin 'uhs-robert/tmux-oasis'
set -g @oasis_flavor "moonlight_dark"
set -g @oasis_separator "round"
set -g @oasis_dim_inactive "off"

# fzf
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

run '~/.config/tmux/plugins/tpm/tpm'
